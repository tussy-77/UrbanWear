<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanWear - Moda Urbana Moderna</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Ajustes visuales rápidos para el menú de usuario */
        .header__actions { display: flex; align-items: center; gap: 20px; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .profile-dropdown-wrapper { position: relative; }
        .profile-dropdown {
            display: none;
            position: absolute;
            top: 110%;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            min-width: 160px;
            z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .profile-dropdown.active { display: block; }
        .profile-dropdown a, .profile-dropdown button {
            display: block;
            width: 100%;
            padding: 12px 16px;
            color: white;
            text-decoration: none;
            text-align: left;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
        }
        .profile-dropdown a:hover, .profile-dropdown button:hover { background: #252525; }
        .logout-link { color: #ff4d4d !important; border-top: 1px solid #333 !important; }
        .welcome-text { color: #888; font-size: 14px; }
        .welcome-text strong { color: #fff; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__wrapper">
                <div class="logo">
                    <span class="logo__icon">◆</span>
                    <span class="logo__text">UrbanWear</span>
                </div>
                
                <nav class="nav">
                    <a href="#" class="nav__link">Catálogo</a>
                    <a href="#" class="nav__link">Nuevo</a>
                    <a href="#" class="nav__link">Sobre</a>
                    <a href="#" class="nav__link">Contacto</a>
                </nav>

                <div class="header__actions">
                    <div class="cart-wrapper">
                        <button class="cart-button" id="cart-toggle">
                            <span class="cart-icon">🛒</span>
                            <span class="cart-badge" id="cart-badge">0</span>
                        </button>
                        <div class="cart-dropdown" id="cart-dropdown">
                            <div class="cart-dropdown__header"><h3>Tu Carrito</h3></div>
                            <div class="cart-dropdown__body" id="cart-items-container">
                                <p class="cart-empty-msg">Cargando...</p>
                            </div>
                            <div class="cart-dropdown__footer">
                                <div class="cart-total">
                                    <span>Total:</span>
                                    <span class="cart-total-amount">$<span id="cart-total-value">0</span></span>
                                </div>
                                <button class="btn btn--primary btn--full" onclick="procesarPago()">Finalizar Compra</button>
                            </div>
                        </div>
                    </div>

                    <div id="user-menu-container">
                        <div id="guest-buttons" class="user-auth-buttons">
                            <a href="/user_login" class="btn btn--secondary btn--sm">Ingresar</a>
                            <a href="/user_register" class="btn btn--primary btn--sm">Registrarse</a>
                        </div>

                        <div id="user-profile-menu" style="display: none;" class="user-profile">
                            <span class="welcome-text">Hola, <strong id="user-display-name">Usuario</strong></span>
                            <div class="profile-dropdown-wrapper">
                                <button class="btn btn--secondary btn--sm" onclick="toggleProfileMenu()">Mi Perfil 👤</button>
                                <div id="profile-dropdown" class="profile-dropdown">
                                    <a href="/mis-pedidos">Mis Pedidos</a>
                                    <button onclick="cerrarSesion()" class="logout-link">Cerrar Sesión</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> </div>
        </div>
    </header>

    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">Estilo Urbano<br>Hecho para Ti</h1>
            <p class="hero__subtitle">Descubre la colección que define la moda moderna</p>
            <a href="#" class="btn btn--primary btn--lg">Explorar Colección</a>
        </div>
        <div class="hero__image">
            <div class="hero__image-placeholder">
                <span class="placeholder-text">Imagen Destacada</span>
            </div>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
    <script>
        // Función visual para el dropdown
        function toggleProfileMenu() {
            document.getElementById('profile-dropdown').classList.toggle('active');
        }
        // Cerrar al hacer clic fuera
        window.onclick = function(event) {
            if (!event.target.matches('.btn--secondary')) {
                var dropdowns = document.getElementsByClassName("profile-dropdown");
                for (var i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('active')) {
                        dropdowns[i].classList.remove('active');
                    }
                }
            }
        }
    </script>
    <script>
    // 1. Verificar sesión al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('urban_token');
        const nombre = localStorage.getItem('client_name');

        const guestButtons = document.getElementById('guest-buttons');
        const userProfileMenu = document.getElementById('user-profile-menu');
        const displayName = document.getElementById('user-display-name');

        if (token && nombre) {
            // Si hay sesión, ocultamos botones de ingreso y mostramos perfil
            guestButtons.style.display = 'none';
            userProfileMenu.style.display = 'flex';
            displayName.innerText = nombre;
        } else {
            // Si no hay sesión, aseguramos que se vean los botones de ingreso
            guestButtons.style.display = 'flex';
            userProfileMenu.style.display = 'none';
        }
    });

    // 2. Función para Cerrar Sesión
    function cerrarSesion() {
        localStorage.removeItem('urban_token');
        localStorage.removeItem('client_name');
        alert("Sesión cerrada correctamente.");
        window.location.reload(); // Recarga para volver al estado inicial
    }
</script>
</body>
</html>
