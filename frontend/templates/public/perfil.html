{% extends 'public/base.html' %}
{% block content %}

<div style="min-height: 80vh; background: #f5f5f5; padding: 60px 0;">
    <div class="container" style="max-width: 900px; margin: 0 auto; padding: 0 20px;">

        <h1 style="font-size: 1.4rem; font-weight: 800; color: #111; margin-bottom: 32px;">¡HOLA, <span id="greeting-name"></span>!</h1>

        <div style="display: flex; gap: 32px;">

            <!-- Sidebar izquierdo -->
            <aside style="width: 200px; flex-shrink: 0;">
                <nav style="display: flex; flex-direction: column; gap: 4px;">
                    <a href="/perfil" class="perfil-nav-link perfil-nav-link--active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM74.08,197.5a64,64,0,0,1,107.84,0,87.83,87.83,0,0,1-107.84,0ZM128,144a40,40,0,1,1,40-40A40,40,0,0,1,128,144Zm76.24,42.81a80,80,0,0,0-152.48,0,87.81,87.81,0,0,1,152.48,0Z"/></svg>
                        PERFIL
                    </a>
                    <a href="/direcciones" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,16a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,16Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,192Zm40-104H136V72a8,8,0,0,0-16,0v24H104a8,8,0,0,0,0,16h16v72a8,8,0,0,0,16,0V112h32a8,8,0,0,0,0-16Z"/></svg>
                        DIRECCIONES
                    </a>
                    <a href="/pedidos" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M223.15,68.72l-96-40a8,8,0,0,0-6.3,0l-96,40A8,8,0,0,0,20,76V180a8,8,0,0,0,4.85,7.28l96,40a8,8,0,0,0,6.3,0l96-40A8,8,0,0,0,236,180V76A8,8,0,0,0,223.15,68.72ZM128,45l76.81,32L128,109,51.19,77ZM36,90.54l84,35v95.67L36,186.12ZM136,221.21V125.54l84-35v95.58Z"/></svg>
                        PEDIDOS
                    </a>
                    <a href="/informacion" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a16,16,0,1,1,16,16A16,16,0,0,1,112,84Z"/></svg>
                        INFORMACIÓN
                    </a>
                    <button onclick="cerrarSesion()" class="perfil-nav-link perfil-nav-link--danger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M120,216a8,8,0,0,1-8,8H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h64a8,8,0,0,1,0,16H48V208h64A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/></svg>
                        CERRAR SESIÓN
                    </button>
                </nav>
            </aside>

            <!-- Panel principal -->
            <div style="flex: 1;">
                <div style="background: #fff; border-radius: 8px; border: 1px solid #e5e5e5; padding: 32px; position: relative;">

                    <!-- Botón editar / guardar -->
                    <button id="btn-editar" onclick="toggleEditar()" 
                        style="position:absolute; top:24px; right:24px; background:none; border:none; cursor:pointer; color:#888;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor"><path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"/></svg>
                    </button>

                    <div class="perfil-grid">

                        <div class="perfil-campo">
                            <label class="perfil-label">NOMBRE</label>
                            <span class="perfil-valor" id="show-name"></span>
                            <input class="perfil-input" id="edit-name" type="text" placeholder="Tu nombre" style="display:none;">
                        </div>

                        <div class="perfil-campo">
                            <label class="perfil-label">APELLIDO</label>
                            <span class="perfil-valor" id="show-last_name"></span>
                            <input class="perfil-input" id="edit-last_name" type="text" placeholder="Tu apellido" style="display:none;">
                        </div>

                        <div class="perfil-campo" style="grid-column: span 2;">
                            <label class="perfil-label">EMAIL</label>
                            <span class="perfil-valor" id="show-email" style="color:#888;"></span>
                        </div>

                        <div class="perfil-campo">
                            <label class="perfil-label">DOCUMENTO</label>
                            <span class="perfil-valor" id="show-document"></span>
                            <input class="perfil-input" id="edit-document" type="text" placeholder="Nº documento" style="display:none;">
                        </div>

                        <div class="perfil-campo">
                            <label class="perfil-label">GÉNERO</label>
                            <span class="perfil-valor" id="show-gender"></span>
                            <select class="perfil-input" id="edit-gender" style="display:none;">
                                <option value="">Seleccionar</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Femenino">Femenino</option>
                                <option value="Otro">Otro</option>
                                <option value="Prefiero no decir">Prefiero no decir</option>
                            </select>
                        </div>

                        <div class="perfil-campo">
                            <label class="perfil-label">FECHA DE NACIMIENTO</label>
                            <span class="perfil-valor" id="show-birth_date"></span>
                            <input class="perfil-input" id="edit-birth_date" type="date" style="display:none;">
                        </div>

                        <div class="perfil-campo">
                            <label class="perfil-label">TELÉFONO PERSONAL</label>
                            <span class="perfil-valor" id="show-phone"></span>
                            <input class="perfil-input" id="edit-phone" type="tel" placeholder="Tu teléfono" style="display:none;">
                        </div>

                    </div>

                    <!-- Botón guardar (solo visible en modo edición) -->
                    <div id="btn-guardar-wrapper" style="display:none; margin-top:24px; text-align:right;">
                        <button onclick="guardarPerfil()" 
                            style="padding:10px 28px; background:#111; color:#fff; border:none; border-radius:8px; font-weight:700; font-size:0.85rem; letter-spacing:1px; cursor:pointer;">
                            GUARDAR CAMBIOS
                        </button>
                        <p id="perfil-msg" style="margin-top:10px; font-size:0.85rem; display:none;"></p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>



<script>
let modoEdicion = false;
let perfilData = {};

async function cargarPerfil() {
    const token = localStorage.getItem('urban_token');
    if (!token) { window.location.href = '/'; return; }

    const res = await fetch('http://127.0.0.1:5000/api/auth/perfil', {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    perfilData = data;

    document.getElementById('greeting-name').textContent = (data.name || '').toUpperCase();
    document.getElementById('show-name').textContent = data.name || '—';
    document.getElementById('show-last_name').textContent = data.last_name || '—';
    document.getElementById('show-email').textContent = data.email || '—';
    document.getElementById('show-document').textContent = data.document || '—';
    document.getElementById('show-gender').textContent = data.gender || '—';
    document.getElementById('show-birth_date').textContent = data.birth_date || '—';
    document.getElementById('show-phone').textContent = data.phone || '—';

    document.getElementById('edit-name').value = data.name || '';
    document.getElementById('edit-last_name').value = data.last_name || '';
    document.getElementById('edit-document').value = data.document || '';
    document.getElementById('edit-gender').value = data.gender || '';
    document.getElementById('edit-birth_date').value = data.birth_date || '';
    document.getElementById('edit-phone').value = data.phone || '';
}

function toggleEditar() {
    modoEdicion = !modoEdicion;
    const campos = ['name', 'last_name', 'document', 'gender', 'birth_date', 'phone'];
    campos.forEach(c => {
        document.getElementById(`show-${c}`).style.display = modoEdicion ? 'none' : 'block';
        document.getElementById(`edit-${c}`).style.display = modoEdicion ? 'block' : 'none';
    });
    document.getElementById('btn-guardar-wrapper').style.display = modoEdicion ? 'block' : 'none';
}

async function guardarPerfil() {
    const token = localStorage.getItem('urban_token');
    const payload = {
        name:       document.getElementById('edit-name').value,
        last_name:  document.getElementById('edit-last_name').value,
        document:   document.getElementById('edit-document').value,
        gender:     document.getElementById('edit-gender').value,
        birth_date: document.getElementById('edit-birth_date').value,
        phone:      document.getElementById('edit-phone').value,
    };

    const res = await fetch('http://127.0.0.1:5000/api/auth/perfil', {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const data = await res.json();

    const msg = document.getElementById('perfil-msg');
    if (res.ok) {
        localStorage.setItem('client_name', payload.name);
        msg.style.color = '#2f855a';
        msg.textContent = '✅ Cambios guardados correctamente.';
        msg.style.display = 'block';
        setTimeout(() => { toggleEditar(); cargarPerfil(); msg.style.display = 'none'; }, 1500);
    } else {
        msg.style.color = '#e53e3e';
        msg.textContent = data.msg || 'Error al guardar.';
        msg.style.display = 'block';
    }
}

document.addEventListener('DOMContentLoaded', cargarPerfil);
</script>

{% endblock %}
