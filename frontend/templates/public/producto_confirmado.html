{% extends 'public/base.html' %}
{% block content %}
<div style="min-height:60vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:60px 20px;">
    <div>
        <div style="width:80px;height:80px;background:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 256 256" fill="white"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg>
        </div>
        <h1 style="font-size:1.5rem; font-weight:800; color:#fff; margin-bottom:12px;">¡PEDIDO CONFIRMADO!</h1>
        <p style="color:#888; margin-bottom:8px;">Tu orden ha sido procesada exitosamente.</p>
        <p id="orden-id" style="color:#aaa; font-size:0.85rem; margin-bottom:32px;"></p>
        <a href="/" style="padding:12px 32px; background:#fff; color:#111; border-radius:8px; font-weight:700; font-size:0.85rem; letter-spacing:1px; text-decoration:none;">
            SEGUIR COMPRANDO
        </a>
    </div>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const orden = params.get('orden');
    if (orden) document.getElementById('orden-id').textContent = `Orden #${orden}`;
</script>
{% endblock %}
