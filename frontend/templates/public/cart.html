<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito - VentasHub</title>
    <link rel="stylesheet" href="static/css/main.css"> <style>
        body { font-family: 'Inter', sans-serif; padding: 40px; background: #f4f7f6; }
        .cart-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .total-section { text-align: right; margin-top: 20px; font-size: 1.5rem; font-weight: bold; }
        .btn-pay { background: #2563eb; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="cart-container">
        <div class="cart-header">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" style="vertical-align:-3px;margin-right:6px;"><path d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16H34.05l32.51,168.86A24,24,0,1,0,88,224a23.59,23.59,0,0,0-1.6-8h57.2a23.59,23.59,0,0,0-1.6,8,24,24,0,1,0,24-24H72l-4-20.68,148-12.29a8,8,0,0,0,7.1-6.57l16-96A8,8,0,0,0,222.14,58.87ZM80,200a8,8,0,1,1-8-8A8,8,0,0,1,80,200Zm96,0a8,8,0,1,1-8-8A8,8,0,0,1,176,200ZM185.28,171.71l-144.53,12-12.33-64H204.26Z"/></svg>
                Tu Carrito
            </h2>
            <span id="cart-badge" style="background: #000; color: #fff; padding: 5px 12px; border-radius: 20px;">0 items</span>
        </div>

        <div id="cart-items-container">
            <p>Cargando productos...</p>
        </div>

        <div class="total-section">
            Total: $<span id="cart-total-value">0</span>
        </div>

        <button class="btn-pay">Finalizar Compra</button>
        <button onclick="window.location.href='home.html'" style="background:none; border:none; color:#666; cursor:pointer; margin-top:10px;">← Volver a la tienda</button>
    </div>

    <script src="static/js/cart.js"></script>
</body>
</html>
