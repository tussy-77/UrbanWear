{% extends "public/base.html" %}
{% block title %}Favoritos | UrbanWear{% endblock %}

{% block content %}
<main style="max-width:1100px; margin:0 auto; padding:48px 20px 80px;">

    <h1 style="font-size:1.1rem; font-weight:800; color:#fff; letter-spacing:3px; text-transform:uppercase; margin-bottom:40px;">
        MIS FAVORITOS
    </h1>

    <div id="favoritos-empty" style="display:none; text-align:center; padding:80px 0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8" style="margin-bottom:20px;"><path d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32Z"/></svg>
        <p style="color:rgba(255,255,255,0.35); font-size:0.85rem; letter-spacing:1px;">Aún no tienes productos guardados</p>
        <a href="/catalogo" style="display:inline-block; margin-top:24px; padding:12px 32px; background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.75); border:1px solid rgba(255,255,255,0.12); border-radius:8px; font-size:0.78rem; font-weight:700; letter-spacing:2px; text-decoration:none;">
            IR AL CATÁLOGO
        </a>
    </div>

    <div id="favoritos-grid" style="display:none; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:20px;"></div>

</main>
{% endblock %}
