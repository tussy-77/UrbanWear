{% extends 'public/base.html' %}
{% block content %}

<div style="min-height: 80vh; background: #f5f5f5; padding: 60px 0;">
    <div class="container" style="max-width: 900px; margin: 0 auto; padding: 0 20px;">

        <h1 style="font-size: 1.4rem; font-weight: 800; color: #111; margin-bottom: 32px;">
            ¡HOLA, <span id="greeting-name"></span>!
        </h1>

        <div style="display: flex; gap: 32px;">

            <!-- Sidebar — idéntico al de perfil -->
            <aside style="width: 200px; flex-shrink: 0;">
                <nav style="display: flex; flex-direction: column; gap: 4px;">
                    <a href="/perfil" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24ZM74.08,197.5a64,64,0,0,1,107.84,0,87.83,87.83,0,0,1-107.84,0ZM128,144a40,40,0,1,1,40-40A40,40,0,0,1,128,144Zm76.24,42.81a80,80,0,0,0-152.48,0,87.81,87.81,0,0,1,152.48,0Z"/></svg>
                        PERFIL
                    </a>
                    <a href="/direcciones" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,16a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,16Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,192Zm40-104H136V72a8,8,0,0,0-16,0v24H104a8,8,0,0,0,0,16h16v72a8,8,0,0,0,16,0V112h32a8,8,0,0,0,0-16Z"/></svg>
                        DIRECCIONES
                    </a>
                    <a href="/pedidos" class="perfil-nav-link perfil-nav-link--active">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M223.15,68.72l-96-40a8,8,0,0,0-6.3,0l-96,40A8,8,0,0,0,20,76V180a8,8,0,0,0,4.85,7.28l96,40a8,8,0,0,0,6.3,0l96-40A8,8,0,0,0,236,180V76A8,8,0,0,0,223.15,68.72ZM128,45l76.81,32L128,109,51.19,77ZM36,90.54l84,35v95.67L36,186.12ZM136,221.21V125.54l84-35v95.58Z"/></svg>
                        PEDIDOS
                    </a>
                    <a href="/informacion" class="perfil-nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm16-40a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176ZM112,84a16,16,0,1,1,16,16A16,16,0,0,1,112,84Z"/></svg>
                        INFORMACIÓN
                    </a>
                    <button onclick="cerrarSesion()" class="perfil-nav-link perfil-nav-link--danger">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M120,216a8,8,0,0,1-8,8H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h64a8,8,0,0,1,0,16H48V208h64A8,8,0,0,1,120,216Zm109.66-93.66-40-40a8,8,0,0,0-11.32,11.32L204.69,120H112a8,8,0,0,0,0,16h92.69l-26.35,26.34a8,8,0,0,0,11.32,11.32l40-40A8,8,0,0,0,229.66,122.34Z"/></svg>
                        CERRAR SESIÓN
                    </button>
                </nav>
            </aside>

            <!-- Panel principal -->
            <div style="flex: 1;">
                <h2 style="font-size:0.95rem; font-weight:700; color:#111; margin:0 0 16px; letter-spacing:1px;">MIS PEDIDOS</h2>
                <div id="lista-pedidos"></div>
            </div>

        </div>
    </div>
</div>



<script>
const statusConfig = {
    'pendiente':  { label: 'Pendiente',  bg: '#fff8e1', color: '#b7791f' },
    'pending':    { label: 'Pendiente',  bg: '#fff8e1', color: '#b7791f' },
    'paid':       { label: 'Pagado',     bg: '#e6fffa', color: '#2c7a7b' },
    'shipped':    { label: 'Enviado',    bg: '#ebf8ff', color: '#2b6cb0' },
    'completado': { label: 'Completado', bg: '#f0fff4', color: '#276749' },
    'completed':  { label: 'Completado', bg: '#f0fff4', color: '#276749' },
    'cancelled':  { label: 'Cancelado',  bg: '#fff5f5', color: '#c53030' },
};

function togglePedido(id) {
    const body = document.getElementById(`pedido-body-${id}`);
    const arrow = document.getElementById(`pedido-arrow-${id}`);
    const isOpen = body.style.display === 'block';
    body.style.display = isOpen ? 'none' : 'block';
    arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
}

async function cargarPedidos() {
    const token = localStorage.getItem('urban_token');
    const res = await fetch('/api/orders/mis-pedidos', {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    const pedidos = await res.json();
    const container = document.getElementById('lista-pedidos');

    if (!pedidos.length) {
        container.innerHTML = `
            <div style="background:#fff; border:1px solid #e5e5e5; border-radius:8px; padding:48px; text-align:center;">
                <p style="color:#888; margin:0 0 16px; font-size:0.9rem;">Aún no tienes pedidos realizados.</p>
                <a href="/catalogo" style="padding:10px 24px; background:#111; color:#fff; border-radius:6px; font-size:0.8rem; font-weight:700; text-decoration:none;">
                    IR AL CATÁLOGO
                </a>
            </div>`;
        return;
    }

    container.innerHTML = pedidos.map(p => {
        const st = statusConfig[p.status] || { label: p.status, bg: '#f0f0f0', color: '#555' };
        return `
        <div class="pedido-card">
            <div class="pedido-card__header" onclick="togglePedido(${p.id})">
                <div style="display:flex; flex-direction:column; gap:4px;">
                    <span style="font-size:0.85rem; font-weight:700; color:#111;">Orden #${p.id}</span>
                    <span style="font-size:0.78rem; color:#888;">${p.fecha} · ${p.items.length} producto${p.items.length !== 1 ? 's' : ''}</span>
                </div>
                <div style="display:flex; align-items:center; gap:16px;">
                    <span style="font-size:0.9rem; font-weight:700; color:#111;">$ ${p.total.toLocaleString()}</span>
                    <span class="pedido-badge" style="background:${st.bg}; color:${st.color};">${st.label}</span>
                    <span id="pedido-arrow-${p.id}" style="color:#888; display:flex; transition:transform 0.2s;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
                    </span>
                </div>
            </div>

            <div class="pedido-card__body" id="pedido-body-${p.id}">
                ${p.items.map(item => `
                    <div class="pedido-item">
                        <img src="/static/uploads/${item.image_url}"
                            onerror="this.src='https://placehold.co/56x56?text=?'"
                            style="width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid #eee;">
                        <div style="flex:1;">
                            <p style="margin:0; font-size:0.88rem; font-weight:600; color:#111;">${item.product_name}</p>
                            <p style="margin:4px 0 0; font-size:0.78rem; color:#888;">Cant: ${item.quantity} · $ ${item.price.toLocaleString()} c/u</p>
                        </div>
                        <span style="font-size:0.88rem; font-weight:700; color:#111;">$ ${item.subtotal.toLocaleString()}</span>
                    </div>
                `).join('')}

                <div style="margin-top:16px; padding-top:14px; border-top:1px solid #f0f0f0; display:flex; justify-content:flex-end; gap:8px;">
                    <span style="font-size:0.85rem; color:#888;">Total del pedido:</span>
                    <span style="font-size:0.85rem; font-weight:700; color:#111;">$ ${p.total.toLocaleString()}</span>
                </div>
            </div>
        </div>`;
    }).join('');
}

document.addEventListener('DOMContentLoaded', async () => {
    const token = localStorage.getItem('urban_token');
    if (!token) { window.location.href = '/'; return; }

    const res = await fetch('/api/auth/perfil', {
        headers: { 'Authorization': `Bearer ${token}` }
    });
    const user = await res.json();
    document.getElementById('greeting-name').textContent = (user.name || '').toUpperCase();
    cargarPedidos();
});
</script>

{% endblock %}
