<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — UrbanWear</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        .brand {
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #111;
            margin-bottom: 32px;
            display: block;
            text-decoration: none;
        }
        h1 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #111;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        p.sub {
            font-size: 0.83rem;
            color: #888;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #555;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 0.88rem;
            font-family: inherit;
            color: #111;
            outline: none;
            transition: border-color 0.15s;
            margin-bottom: 16px;
        }
        input:focus { border-color: #111; }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s;
            margin-top: 4px;
        }
        button[type="submit"]:hover { background: #333; }
        button[type="submit"]:disabled { background: #ccc; cursor: not-allowed; }
        .msg {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 7px;
            font-size: 0.83rem;
            font-weight: 600;
            display: none;
        }
        .msg--ok    { background: #f0fff4; color: #276749; }
        .msg--error { background: #fff5f5; color: #c53030; }
        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            font-size: 0.78rem;
            color: #888;
            text-decoration: none;
        }
        .back:hover { color: #111; }
    </style>
</head>
<body>
<div class="card">
    <a href="/" class="brand">URBANWEAR</a>
    <h1>Crea una nueva contraseña</h1>
    <p class="sub">Debe tener al menos 6 caracteres.</p>

    <form id="reset-form" onsubmit="submitReset(event)">
        <label>NUEVA CONTRASEÑA</label>
        <input type="password" id="password" placeholder="••••••••" minlength="6" required>

        <label>CONFIRMAR CONTRASEÑA</label>
        <input type="password" id="password2" placeholder="••••••••" minlength="6" required>

        <button type="submit" id="btn-submit">GUARDAR CONTRASEÑA</button>
    </form>

    <div id="msg" class="msg"></div>
    <a href="/" class="back">Volver al inicio</a>
</div>

<script>
const TOKEN = '{{ token }}';

async function submitReset(e) {
    e.preventDefault();
    const pass  = document.getElementById('password').value;
    const pass2 = document.getElementById('password2').value;
    const btn   = document.getElementById('btn-submit');
    const msg   = document.getElementById('msg');

    msg.style.display = 'none';

    if (pass !== pass2) {
        showMsg('Las contraseñas no coinciden.', 'error');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'GUARDANDO...';

    const res  = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, password: pass })
    });
    const data = await res.json();

    if (res.ok) {
        showMsg(data.msg, 'ok');
        document.getElementById('reset-form').style.display = 'none';
        setTimeout(() => { window.location.href = '/'; }, 2500);
    } else {
        showMsg(data.msg || 'Ocurrió un error.', 'error');
        btn.disabled = false;
        btn.textContent = 'GUARDAR CONTRASEÑA';
    }
}

function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = `msg msg--${type}`;
    el.style.display = 'block';
}
</script>
</body>
</html>
