<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Sistema de Ventas</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-left">
        <div class="login-content">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 256 256" fill="currentColor"><path d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16H34.05l32.51,168.86A24,24,0,1,0,88,224a23.59,23.59,0,0,0-1.6-8h57.2a23.59,23.59,0,0,0-1.6,8,24,24,0,1,0,24-24H72l-4-20.68,148-12.29a8,8,0,0,0,7.1-6.57l16-96A8,8,0,0,0,222.14,58.87ZM80,200a8,8,0,1,1-8-8A8,8,0,0,1,80,200Zm96,0a8,8,0,1,1-8-8A8,8,0,0,1,176,200ZM185.28,171.71l-144.53,12-12.33-64H204.26Z"/></svg>
            </div>
            <h1 class="login-title">UrbanWear</h1>
            <p class="login-subtitle">Un estilo Urbano hecho para ti</p>
            <div class="feature-list">
                <div class="feature-item">
                    <div class="feature-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg></div>
                    <span>Diseños moderno y atractivo</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg></div>
                    <span>Calidad premium en cada pieza</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg></div>
                    <span>Entrega rápida y segura</span>
                </div>
                <div class="feature-item">
                    <div class="feature-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor"><path d="M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"/></svg></div>
                    <span>Soporte al cliente 24/7</span>
                </div>
            </div>
        </div>
    </div>

    <div class="login-right">
        <div class="login-form-container">
            <div class="form-header">
                <h2 class="form-title">Acceder</h2>
                <p class="form-subtitle">Ingresa tus credenciales para continuar</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" style="vertical-align:-2px;margin-right:5px;"><path d="M224,48H32a8,8,0,0,0-8,8V192a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A8,8,0,0,0,224,48ZM203.43,64,128,133.15,52.57,64ZM216,192H40V74.19l82.59,75.71a8,8,0,0,0,10.82,0L216,74.19V192Z"/></svg>Correo Electrónico</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="tu@correo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label class="form-label"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 256 256" fill="currentColor" style="vertical-align:-2px;margin-right:5px;"><path d="M208,80H168V72a40,40,0,0,0-80,0v8H48A16,16,0,0,0,32,96V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V96A16,16,0,0,0,208,80ZM104,72a24,24,0,0,1,48,0v8H104Zm104,136H48V96H208V208Zm-68-56a12,12,0,1,1-12-12A12,12,0,0,1,144,152Z"/></svg>Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >
                </div>

                <div class="form-remember">
                    <input type="checkbox" id="remember" class="form-checkbox">
                    <label for="remember">Recuérdame en este dispositivo</label>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    Acceder
                </button>
            </form>

            <div class="form-divider">o</div>

            <div class="form-footer">
                ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');

        function showAlert(message, type) {
            alertBox.className = `alert show alert-${type}`;
            alertBox.textContent = message;
        }

        function hideAlert() {
            alertBox.classList.remove('show');
        }

        function setLoading(isLoading) {
            btnSubmit.disabled = isLoading;
            if (isLoading) {
                btnSubmit.innerHTML = '<div class="spinner"></div> Accediendo...';
            } else {
                btnSubmit.textContent = 'Acceder';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Por favor completa todos los campos', 'error');
                return;
            }

            setLoading(true);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.access_token) {
                    localStorage.setItem('urban_token', data.access_token);
                    const nombre = (data.user && (data.user.name || data.user.username)) || email;
                    localStorage.setItem('client_name', nombre);

                    showAlert('¡Login exitoso! Redirigiendo...', 'success');
                    setTimeout(() => { window.location.href = '/'; }, 1500);
                } else {
                    showAlert(data.msg || 'Error al iniciar sesión', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('Error de conexión. Intenta de nuevo.', 'error');
            } finally {
                setLoading(false);
            }
        }

        // Limpiar alerta cuando el usuario empieza a escribir
        emailInput.addEventListener('focus', hideAlert);
        passwordInput.addEventListener('focus', hideAlert);
    </script>
</body>
</html>
